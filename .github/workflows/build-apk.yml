name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://axhytnezkqzjxdzfminl.supabase.co' }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_6AqxgXoeJjg4qEB2Tr_dFA_GPyH7UPr' }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 💾 Increase Swap Space (Prevent Out-Of-Memory)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: 🔐 Setup Environment Variables (.env)
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}" >> .env

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: 📝 Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📦 Install npm dependencies
        run: npm install

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 📝 Configure Android Build Environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          printf "\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m\norg.gradle.parallel=false\norg.gradle.workers.max=2\n" >> android/gradle.properties
          echo "=== ANDROID GRADLE PROPERTIES ==="
          cat android/gradle.properties

      - name: 🔨 Build Android APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: 📦 Inspect and Stage Artifacts
        run: |
          mkdir -p apk-output
          echo "=== SEARCHING WORKSPACE FOR APK FILES ==="
          find . -name "*.apk" -ls || true
          find . -name "*.apk" -exec cp -v {} apk-output/ \; || true
          echo "=== SEARCHING WORKSPACE FOR AAB FILES ==="
          find . -name "*.aab" -ls || true
          find . -name "*.aab" -exec cp -v {} apk-output/ \; || true
          echo "=== ALL BUILD OUTPUTS ==="
          ls -laR android/app/build/outputs/ || true

      - name: 🚀 Push APK and Logs to apk-build Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/publish
          cp -v gradle-build.log /tmp/publish/build.log || true
          cp -v apk-output/* /tmp/publish/ 2>/dev/null || true
          git branch -D apk-build 2>/dev/null || true
          git checkout --orphan apk-build
          git rm -rf . || true
          cp -v /tmp/publish/* ./ 2>/dev/null || true
          ls -la
          git add -f -A
          git commit -m "build: publish build artifacts and logs [skip ci]" || true
          git push -f origin apk-build || true

      - name: 🚀 Publish Direct Download Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "E-Sauli APK Direct Download"
          body: "Standalone APK build for E-Sauli Lost and Found campus app. Click the `app-release.apk` link below to download directly to your mobile device."
          files: apk-output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: 📤 Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E-Sauli-LostAndFound-APK
          path: apk-output/*
          retention-days: 14
