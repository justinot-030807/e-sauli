name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://axhytnezkqzjxdzfminl.supabase.co' }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_6AqxgXoeJjg4qEB2Tr_dFA_GPyH7UPr' }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 💾 Increase Swap Space (Prevent Out-Of-Memory)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: 🔐 Setup Environment Variables (.env)
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}" >> .env

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: 📝 Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📦 Install npm dependencies
        run: npm install

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 📝 Configure Android Build Environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties || echo "reactNativeArchitectures=arm64-v8a" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties

      - name: 🔨 Build Android Standalone APK (assembleRelease)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: 📦 Locate and Stage Artifacts
        run: |
          echo "=== FULL GRADLE BUILD LOG ==="
          cat gradle-build.log || true
          mkdir -p apk-output
          echo "=== SEARCHING FOR ALL BUILT FILES IN outputs/ ==="
          find android/app/build/outputs -type f -ls || true
          find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp -v {} apk-output/ \; || true
          echo "=== STAGED ARTIFACTS IN apk-output/ ==="
          ls -la apk-output/

      - name: 📤 Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Sauli-LostAndFound-APK
          path: apk-output/*
          retention-days: 14
