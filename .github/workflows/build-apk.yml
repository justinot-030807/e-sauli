name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📝 Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📦 Install npm dependencies
        run: npm install

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://axhytnezkqzjxdzfminl.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_6AqxgXoeJjg4qEB2Tr_dFA_GPyH7UPr' }}
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Sauli-LostAndFound-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
