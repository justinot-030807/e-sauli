name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 💾 Increase Swap Space (Prevent Out-Of-Memory)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📝 Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📦 Install npm dependencies
        run: npm install

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://axhytnezkqzjxdzfminl.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_6AqxgXoeJjg4qEB2Tr_dFA_GPyH7UPr' }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: 📝 Configure Android Build Environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          org.gradle.parallel=false
          org.gradle.workers.max=2
          EOF

      - name: 🔨 Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: 📋 Show Error Logs if Build Fails
        if: failure()
        run: |
          echo "=== GRADLE BUILD FAILURE DIAGNOSTICS ==="
          find android -name "*.log" -exec cat {} + || true

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Sauli-LostAndFound-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
